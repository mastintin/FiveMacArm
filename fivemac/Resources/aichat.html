<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --chat-bg: #242424;
            --text-color: #e0e0e0;
            --accent-color: #007aff;
            --user-bubble: #2b3a4a;
            --ai-bubble: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;
            background-color: var(--ai-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid #444;
        }

        #input-area {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: "SF Mono", Menlo, monospace;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <!-- Los mensajes aparecerán aquí -->
        <div class="bubble ai">¡Hola! Soy tu asistente de FiveMac. ¿En qué puedo ayudarte hoy?</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu pregunta..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addBubble(text, 'user');
            input.value = '';

            // Notificar al mundo nativo (Objective-C)
            if (window.webkit && window.webkit.messageHandlers.fivemac) {
                window.webkit.messageHandlers.fivemac.postMessage(text);
            }
        }

        function addBubble(content, type) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `bubble ${type}`;
            div.innerHTML = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Esta función la llamará Objective-C cuando llegue la respuesta de Groq
        function addAIResponse(content) {
            addBubble(content, 'ai');
        }
    </script>
</body>
</html>
