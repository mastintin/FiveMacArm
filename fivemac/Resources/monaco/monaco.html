<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="container"></div>

<!-- Cargamos el cargador oficial de Monaco -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script src="harbour.js"></script>
<script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});

    require(['vs/editor/editor.main'], function() {
        // Registramos Harbour antes de crear el editor
        if (typeof registerHarbour === "function") registerHarbour(monaco);

        window.editor = monaco.editor.create(document.getElementById('container'), {
            value: "",
            language: 'harbour',
            theme: 'vs-dark',
            automaticLayout: true,
            minimap: { enabled: true }
        });

        // Evento de cambio de texto
        window.editor.onDidChangeModelContent((event) => {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fivemac) {
                // Notificamos a Harbour (podemos mandar el texto entero o solo avisar)
                // Por eficiencia en archivos grandes, mandamos un aviso
                window.webkit.messageHandlers.fivemac.postMessage({
                    name: "onChange",
                    body: "" 
                });
            }
        });
    });

    // --- API EXPUESTA PARA FIVEMAC ---

    function setText(text) {
        if (window.editor) window.editor.setValue(text);
    }

    function getText() {
        if (window.editor) {
            const val = window.editor.getValue();
            window.webkit.messageHandlers.fivemac.postMessage({
                name: "onValues",
                body: val
            });
        }
    }

    function setLanguage(lang) {
        if (window.editor) {
            monaco.editor.setModelLanguage(window.editor.getModel(), lang);
        }
    }

    function setTheme(theme) {
        if (window.editor) {
            monaco.editor.setTheme(theme);
        }
    }

</script>
</body>
</html>
